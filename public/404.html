<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <script>
    // Encode the path as a query param and redirect to index.html
    // so GitHub Pages serves it, then index.html restores the route.
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 2).join('/') +
      '/?p=' + encodeURIComponent(l.pathname.slice(1) + l.search) +
      (l.hash || '')
    );
  </script>
</head>

</html>
